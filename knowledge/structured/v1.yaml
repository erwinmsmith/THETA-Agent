    aliases_en: [LDA, latent Dirichlet allocation]
    source_id: theta-capability-registry
    source_locator: knowledge/capabilities/models/lda.yaml
    claim_scope: THETA 当前 LDA 实现的模型选择依据。
    implementation_name: THETA LDA
    theta_support_status: supported
    content_markdown: |
      LDA 适合作为静态、可解释的词袋主题基线，CPU 可运行。它不原生建模时间演化或元数据效应；短文本很稀疏时主题可能不稳定。

  - <<: *base
    object_id: model.btm
    object_type: model
