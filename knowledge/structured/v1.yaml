    source_locator: knowledge/capabilities/models/btm.yaml
    claim_scope: THETA 当前 BTM 实现的模型选择依据。
    implementation_name: THETA BTM
    theta_support_status: supported
    content_markdown: |
      BTM 面向大量短文本，通过语料级 biterm 缓解单文档共现稀疏。数据必须能形成足够的有效词对；极少量或近乎单词文本会被 Validator V2 拒绝。

  - <<: *base
    object_id: model.hdp
