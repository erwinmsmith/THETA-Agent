    source_locator: knowledge/capabilities/models/hdp.yaml
    claim_scope: THETA 当前 HDP auto 模式的模型选择依据。
    implementation_name: THETA HDP
    theta_support_status: supported
    content_markdown: |
      HDP 用于不希望预先固定主题数的静态词袋分析。CLI 中必须使用 topicCountMode=auto、numTopics=null，并可用 maxTopics 设置搜索上界；上界不是最终主题数。

  - <<: *base
    object_id: model.dtm
