    claim_scope: THETA 当前 STM 元数据建模边界。
    implementation_name: THETA STM
    theta_support_status: conditional
    content_markdown: |
      STM 用于估计来源、行业、组别等元数据与主题比例的关系。至少需要一个已确认且非退化的元数据列；只有自由文本而无可用协变量时不得推荐为主方案。

