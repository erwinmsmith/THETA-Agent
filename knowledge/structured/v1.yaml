    claim_scope: THETA 当前 DTM 实现与时间切片约束。
    implementation_name: THETA DTM
    theta_support_status: conditional
    content_markdown: |
      DTM 适合研究主题随有序时间片的变化。必须确认时间列，且至少两个有效时间片，每片要有足够文档；时间列只是元数据而不参与建模时不应选择 DTM。

