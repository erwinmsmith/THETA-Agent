    claim_scope: CLI Agent 已审计的真实输入、参数、产物、依赖和限制。
    implementation_name: THETA CLI Capability Registry
    content_markdown: |
      能力卡是 Planner 的实现事实边界。Planner 只能在 eligible=true 的模型中提出候选；参数必须能映射到真实 planField 与 trainFlag。能力卡不能替代 Validator V2。

  - <<: *base
    object_id: model.lda
    object_type: model
    title: LDA 静态概率主题模型
    model_ids: [lda]
    scenario_tags: [static, bow, interpretable, cpu]
