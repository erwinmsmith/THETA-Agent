    implementation_name: THETA BERTopic
    theta_support_status: conditional
    content_markdown: |
      BERTopic 适合语义相似但词面不同的文本与短文本探索。auto 模式传 --num_topics 0；target_reduction 才按目标数归并。离线运行必须已有本地 SBERT 模型及 bertopic、umap、hdbscan 依赖。

