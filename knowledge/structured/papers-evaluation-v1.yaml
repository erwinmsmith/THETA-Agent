    theta_support_status: supported
    content_markdown: |
      即使模型 A 的 C_V/NPMI 高于模型 B，Planner 也只能说“自动连贯性证据更好”。最终结论还必须检查主题多样性、稳定性、覆盖/离群、代表文档、主题粒度和研究问题契合度，并记录人工判断。缺少这些证据时应保持不确定性。

