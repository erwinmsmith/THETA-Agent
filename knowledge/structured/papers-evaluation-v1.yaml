    content_markdown: |
      Wallach 等比较了多种 held-out document probability 估计方法，指出常用估计器可能不准确或方差很高。预测拟合指标需要使用可复现且适当的估计方法；它们回答“模型如何解释未见词/文档”，不直接回答主题是否便于人类解释。
    content_hash: null
    updated_at: 2026-08-01T00:00:00.000Z

  - <<: *evaluation_paper_base
    object_id: evaluation.paper_heldout_likelihood
    object_type: evaluation_metric
    title: Held-out likelihood 与 perplexity 评估边界
    model_ids: [lda, hdp, stm, btm, prodlda, etm, theta]
    scenario_tags: [evaluation, heldout_likelihood, perplexity, predictive_fit]
    aliases_zh: [留出似然, 困惑度边界, 预测拟合]
    aliases_en: [held-out likelihood, perplexity evaluation]
    source_id: paper.evaluation.wallach2009
    source_year: 2009
    source_locator: https://doi.org/10.1145/1553374.1553515
    claim_scope: 预测拟合指标的用途和不应承担的语义解释任务。
    theta_support_status: conditional
    content_markdown: |
      Held-out likelihood/perplexity 适合比较同一数据划分、预处理和模型家族中的预测拟合。必须记录估计方法、划分和随机种子。较低 perplexity 或较高 likelihood 不能单独证明主题更连贯、更有意义或更符合研究问题，也不适合直接跨不同数据处理管线比较。

  - <<: *evaluation_paper_base
    object_id: paper_source.evaluation.chang2009
    title: Chang 2009 人类主题解释论文
    model_ids: [lda]
    scenario_tags: [paper, evaluation, human_evaluation, interpretability]
    aliases_zh: [Reading Tea Leaves论文, 主题人工解释论文]
    aliases_en: [Reading Tea Leaves, Chang 2009]
    source_id: paper.evaluation.chang2009
    source_year: 2009
    source_locator: https://proceedings.neurips.cc/paper/2009/hash/f92586a25bb3145facd64ab20fd554ff-Abstract.html
    claim_scope: word intrusion 等人工任务与 held-out likelihood 的解释差异。
    content_markdown: |
      Chang 等通过大规模用户研究提出主题词入侵等任务，发现预测指标较好的模型可能产生更难解释的主题。该论文支持把人类判断纳入验收，而不是把语义质量完全交给 likelihood 或 perplexity。

  - <<: *evaluation_paper_base
    object_id: evaluation.paper_word_intrusion
    object_type: evaluation_metric
    title: Word intrusion 主题可解释性评估
    model_ids: [lda, btm, hdp, dtm, stm, bertopic, theta]
    scenario_tags: [evaluation, human_evaluation, word_intrusion, interpretability]
    aliases_zh: [主题词入侵, 词入侵测试, 人工主题评估]
    aliases_en: [word intrusion, human topic interpretability]
    source_id: paper.evaluation.chang2009
    source_year: 2009
    source_locator: https://proceedings.neurips.cc/paper/2009/hash/f92586a25bb3145facd64ab20fd554ff-Abstract.html
    claim_scope: 用人工识别不属于主题的词来衡量主题词集合的可解释性。
    theta_support_status: supported
    content_markdown: |
      对每个主题混入一个与其不相关但表面合理的词，让评审者选择入侵词；更容易识别通常表示主题词集合更一致。实施时应随机化顺序、记录评审人数与一致性，并与代表文档阅读结合。它评估主题表示，不替代研究问题契合度判断。

  - <<: *evaluation_paper_base
    object_id: rule.paper_predictive_fit_not_interpretability
    object_type: rule
    title: 预测拟合不等于主题可解释性
    model_ids: [lda, btm, hdp, dtm, stm, bertopic, theta]
    scenario_tags: [evaluation, conflict, perplexity_warning, human_review]
    aliases_zh: [困惑度不等于可解释性, 拟合好不代表主题好]
    aliases_en: [predictive fit is not interpretability]
    source_id: paper.evaluation.chang2009
    source_year: 2009
    source_locator: https://proceedings.neurips.cc/paper/2009/hash/f92586a25bb3145facd64ab20fd554ff-Abstract.html
    claim_scope: 自动预测指标与人工语义目标之间的硬性解释边界。
    theta_support_status: supported
    conflict_group_id: predictive_fit_vs_interpretability
    content_markdown: |
      Planner 和结果解释器不得仅凭 perplexity 或 held-out likelihood 宣布主题模型“更好”。如果用户目标是理解主题，至少还要评估主题词、代表文档、重复主题、稳定性和领域专家判断；预测指标只能作为多目标证据之一。

