    source_locator: https://doi.org/10.3115/v1/E14-1056
    claim_scope: PMI/NPMI 指标对参考语料、领域和共现窗口的依赖。
    theta_support_status: supported
    content_markdown: |
      NPMI/PMI 分数必须与参考语料、分词、滑动窗口和 top-N 一起保存。优先使用与目标语料语言和领域相近的参考统计；跨域语料可能改变排序。Planner 不得把来自不同参考语料的分数当作同一标尺。

