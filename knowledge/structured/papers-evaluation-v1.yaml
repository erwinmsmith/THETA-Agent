      首轮根据数据规模、期望粒度和最小可解释主题规模选择低/中/高三个左右 K，而不是穷举大网格。每个 K 做多种子评估，淘汰明显重复、坍塌、过宽或不稳定的区域；第二轮只在有证据的邻域细化。HDP/BERTopic auto 可提供参照，但其实际主题数不是固定 K 的权威答案。

