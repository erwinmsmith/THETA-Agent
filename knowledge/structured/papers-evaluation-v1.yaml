    claim_scope: PMI/NPMI、参考语料与自动化主题词入侵评估。
    content_markdown: |
      Lau、Newman 与 Baldwin 比较 PMI、NPMI 等自动指标与人工判断，并展示参考语料域内/跨域选择会影响相关性。自动指标不仅是一个公式，还依赖参考语料和统计窗口。

