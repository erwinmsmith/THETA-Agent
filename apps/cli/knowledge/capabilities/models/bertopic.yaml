schemaVersion: 1.0.0
modelId: bertopic
displayName: BERTopic
audit:
  status: audited
  auditedAt: 2026-07-31
  sourceRefs:
    - ../../third_party/THETA/src/models/models_config/models.yaml
    - ../../third_party/THETA/src/models/model/baseline/bertopic.py
    - ../../third_party/THETA/src/models/model/baseline_trainer.py
    - ../../third_party/THETA/src/models/run_pipeline.py
    - ../../packages/THETA_tools/tools.py
planner:
  eligible: true
  reason: Validator V2 明确区分 auto 与 target_reduction，并将 UMAP/HDBSCAN 参数编译进真实训练命令。
catalog:
  requires: [sbert, text]
  autoTopics: true
implementation:
  family: embedding_clustering
  language: python
  modulePath: ../../third_party/THETA/src/models/model/baseline/bertopic.py
  trainerEntry: BaselineTrainer.train_bertopic
  prepareMode: baseline
  runtimePackages: [numpy, bertopic, sentence-transformers, umap-learn, hdbscan]
  actualInputs: [raw_text, sbert_embeddings_or_embedding_model]
capabilities:
  temporalTopics: false
  metadataEffects: false
  shortTextOptimized: true
  topicCountMode: fixed_or_reduced
  offlineExecution: conditional
  cpuExecution: conditional
  nativeOutputs: [embedding_clusters, document_topic_distribution, outlier_count]
parameters:
  - parameterId: n_neighbors
    valueType: integer
    defaultValue: 15
    catalogName: n_neighbors
    planField: nNeighbors
    trainFlag: --n_neighbors
    exposure: agent_compiled
    usedByTraining: true
    minimum: 2
    maximum: 100
    choices: []
    notes: UMAP 邻居数，pipeline 支持但 Agent 未编译。
  - parameterId: n_components
    valueType: integer
    defaultValue: 5
    catalogName: n_components
    planField: nComponents
    trainFlag: --n_components
    exposure: agent_compiled
    usedByTraining: true
    minimum: 2
    maximum: 50
    choices: []
    notes: UMAP 输出维数，pipeline 支持但 Agent 未编译。
  - parameterId: min_cluster_size
    valueType: integer
    defaultValue: 10
    catalogName: min_cluster_size
    planField: minClusterSize
    trainFlag: --min_cluster_size
    exposure: agent_compiled
    usedByTraining: true
    minimum: 2
    maximum: 100
    choices: []
    notes: HDBSCAN 最小簇大小；实际参数名不是 min_topic_size。
  - parameterId: min_samples
    valueType: integer
    defaultValue: null
    catalogName: min_samples
    planField: minSamples
    trainFlag: --min_samples
    exposure: agent_compiled
    usedByTraining: true
    minimum: 1
    maximum: null
    choices: []
    notes: 空值时等于 min_cluster_size。
  - parameterId: top_n_words
    valueType: integer
    defaultValue: 10
    catalogName: top_n_words
    planField: topNWords
    trainFlag: --top_n_words
    exposure: agent_compiled
    usedByTraining: true
    minimum: 1
    maximum: 30
    choices: []
    notes: 每个主题输出词数。
  - parameterId: random_state
    valueType: integer
    defaultValue: 42
    catalogName: random_state
    planField: randomState
    trainFlag: --random_state
    exposure: agent_compiled
    usedByTraining: true
    choices: []
    notes: UMAP 随机种子。
  - parameterId: topic_target
    valueType: integer
    defaultValue: 20
    catalogName: null
    planField: numTopics
    trainFlag: --num_topics
    exposure: agent_compiled
    usedByTraining: true
    minimum: 2
    maximum: 200
    choices: []
    notes: 当前 Agent 额外注入的目标主题数，会使 BERTopic 执行主题归并/缩减而不再是纯自动主题数。
artifacts:
  - artifactId: document_topic_matrix
    pathPattern: THETA/result/{userId}/{datasetId}/bertopic/{run}/bertopic/theta_k{actualTopics}.npy
    required: true
    producedBy: BaselineTrainer.train_bertopic
    description: 文档—主题分布或由主题标签转换的矩阵。
  - artifactId: topic_word_matrix
    pathPattern: THETA/result/{userId}/{datasetId}/bertopic/{run}/bertopic/beta_k{actualTopics}.npy
    required: true
    producedBy: BaselineTrainer.train_bertopic
    description: 主题—词表示矩阵。
  - artifactId: topic_words
    pathPattern: THETA/result/{userId}/{datasetId}/bertopic/{run}/bertopic/topic_words_k{actualTopics}.json
    required: true
    producedBy: BaselineTrainer.train_bertopic
    description: 每个主题的表示词。
limitations:
  - 未配置有效 SBERT_MODEL_PATH 时会使用 all-MiniLM-L6-v2 名称，缓存缺失时可能访问网络。
  - auto 模式通过 --num_topics 0 传入 trainer；target_reduction 模式才会传入用户目标主题数。
  - 离线计划必须在 Dry Run 中验证 SBERT_MODEL_PATH 指向有效本地模型。
unverifiedClaims: []
