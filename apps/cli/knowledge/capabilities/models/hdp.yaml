schemaVersion: 1.0.0
modelId: hdp
displayName: Hierarchical Dirichlet Process
audit:
  status: audited
  auditedAt: 2026-07-31
  sourceRefs:
    - ../../third_party/THETA/src/models/models_config/models.yaml
    - ../../third_party/THETA/src/models/model/baseline/hdp.py
    - ../../third_party/THETA/src/models/model/baseline_trainer.py
    - ../../third_party/THETA/src/models/run_pipeline.py
    - ../../packages/THETA_tools/tools.py
planner:
  eligible: true
  reason: Validator V2 使用 auto + maxTopics 契约，训练命令不再把固定 numTopics 伪装成 HDP 参数。
catalog:
  requires: [bow]
  autoTopics: true
implementation:
  family: probabilistic_bow
  language: python
  modulePath: ../../third_party/THETA/src/models/model/baseline/hdp.py
  trainerEntry: BaselineTrainer.train_hdp
  prepareMode: baseline
  runtimePackages: [numpy, scipy, gensim]
  actualInputs: [bow_matrix, vocabulary]
capabilities:
  temporalTopics: false
  metadataEffects: false
  shortTextOptimized: false
  topicCountMode: inferred
  offlineExecution: supported
  cpuExecution: supported
  nativeOutputs: [nonparametric_static_topics, document_topic_distribution]
parameters:
  - parameterId: max_topics
    valueType: integer
    defaultValue: 150
    catalogName: max_topics
    planField: maxTopics
    trainFlag: --max_topics
    exposure: agent_compiled
    usedByTraining: true
    minimum: 2
    maximum: null
    choices: []
    notes: 真正限制 HDP 主题上限；当前 Agent 不传递，训练使用 pipeline 默认值 150。
  - parameterId: alpha
    valueType: number
    defaultValue: 1.0
    catalogName: alpha
    planField: null
    trainFlag: --alpha
    exposure: catalog_only
    usedByTraining: true
    minimum: 0
    maximum: null
    choices: []
    notes: pipeline 接受，但 Agent 未编译。
  - parameterId: gamma
    valueType: number
    defaultValue: 1.0
    catalogName: gamma
    planField: null
    trainFlag: null
    exposure: catalog_only
    usedByTraining: true
    minimum: 0
    maximum: null
    choices: []
    notes: trainer 支持，但 run_pipeline 和 Agent 均未暴露。
artifacts:
  - artifactId: document_topic_matrix
    pathPattern: THETA/result/{userId}/{datasetId}/hdp/{run}/hdp/model/theta_k{actualTopics}.npy
    required: true
    producedBy: BaselineTrainer.train_hdp
    description: 使用实际推断主题数命名的文档—主题矩阵。
  - artifactId: topic_word_matrix
    pathPattern: THETA/result/{userId}/{datasetId}/hdp/{run}/hdp/model/beta_k{actualTopics}.npy
    required: true
    producedBy: BaselineTrainer.train_hdp
    description: 使用实际推断主题数命名的主题—词矩阵。
limitations:
  - HDP 的实际主题数只能在训练后确定，Plan 中的 maxTopics 是上限而不是承诺结果。
  - alpha 仍使用 pipeline 默认值；gamma 尚无 run_pipeline CLI 参数。
unverifiedClaims: []
