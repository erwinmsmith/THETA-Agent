  - <<: *model_paper_base
    object_id: failure.paper_neural_component_collapse
    object_type: failure_mode
    title: 神经主题模型 component collapse
    model_ids: [prodlda, etm, ctm, theta]
    parameter_ids: [epochs, learningRate]
    scenario_tags: [failure, neural_topic_model, kl, collapse, training_diagnostics]
    aliases_zh: [主题坍塌, 神经主题组件坍塌]
    aliases_en: [component collapse, posterior collapse in topic models]
    source_id: paper.prodlda.srivastava2017
    source_year: 2017
    source_locator: https://openreview.net/forum?id=BybtVK9lg
    claim_scope: 神经主题模型训练中多个主题不被有效使用的风险。
    theta_support_status: conditional
    content_markdown: |
      若少数主题吸收大部分质量、多个主题词高度重复、文档主题分布缺乏区分或 KL/重构项异常，可能发生 component collapse。计划应保留训练历史、主题使用率和多样性诊断，并与 LDA 等稳定基线比较；不能只看最终 loss。

