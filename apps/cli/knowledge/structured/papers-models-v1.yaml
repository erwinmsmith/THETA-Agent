    object_type: source
    title: Blei 2003 LDA 原始论文
    model_ids: [lda]
    parameter_ids: []
    scenario_tags: [paper, core_model, probabilistic, bow]
    language: bilingual
    aliases_zh: [LDA原始论文, 潜在狄利克雷分配论文]
    aliases_en: [Latent Dirichlet Allocation paper, Blei 2003]
    authority_level: L3
    evidence_type: paper
    source_id: paper.lda.blei2003
    source_year: 2003
    source_locator: https://jmlr.org/papers/v3/blei03a.html
    claim_scope: LDA 的生成假设、文档—主题分布、主题—词分布和变分推断原理。
    implementation_name: null
    implementation_version: null
    theta_support_status: unknown
    confidence: high
    conflict_group_id: null
    content_markdown: |
      Blei、Ng 与 Jordan 将 LDA 定义为层次贝叶斯生成模型：文档由主题混合生成，主题由词概率分布表示。该论文可解释为什么 LDA 是透明的静态词袋基线，但不规定 THETA 当前 sklearn 实现的默认参数，也不能证明主题天然具有时间、因果或群体效应含义。
    content_hash: null
    updated_at: 2026-08-01T00:00:00.000Z

  - <<: *model_paper_base
    object_id: rule.paper_lda_baseline_scope
    object_type: rule
    title: LDA 论文支持的基线范围
    scenario_tags: [model_selection, static, baseline, interpretability]
    aliases_zh: [LDA适用范围, LDA基线依据]
    aliases_en: [LDA baseline scope, when to use LDA]
    theta_support_status: supported
    claim_scope: 从 LDA 原理推导出的候选模型角色，不涉及项目命令参数。
    content_markdown: |
      当研究目标是静态主题发现、语料具有足够词共现、用户需要 CPU 友好且可解释的对照时，可把 LDA 放入候选集。短文本稀疏、需要时间演化或协变量推断时，LDA 仍可作为基线，但不能单独回答这些结构化问题。最终参数必须由 THETA LDA Capability Registry 和 Validator V2 解析。

  - <<: *model_paper_base
    object_id: paper_source.hdp.teh2006
    title: Teh 2006 HDP 原始论文
    model_ids: [hdp]
    scenario_tags: [paper, core_model, nonparametric_bayes, automatic_topic_count]
    aliases_zh: [HDP原始论文, 层次狄利克雷过程论文]
    aliases_en: [Hierarchical Dirichlet Processes paper, Teh 2006]
    source_id: paper.hdp.teh2006
    source_year: 2006
    source_locator: https://doi.org/10.1198/016214506000000302
    claim_scope: HDP 的共享随机测度、非参数混合与文本主题建模原理。
    content_markdown: |
      HDP 通过层次 Dirichlet process 在文档之间共享主题，使有效混合成分数量由数据和后验推断。所谓“非参数”并不表示实现没有有限截断、计算上界或后处理，也不保证每次训练返回唯一且完全相同的主题数。

  - <<: *model_paper_base
    object_id: rule.paper_hdp_auto_is_bounded
    object_type: rule
    title: HDP 自动主题数仍是有界推断
    model_ids: [hdp]
    parameter_ids: [maxTopics, numTopics, topicCountMode]
    scenario_tags: [model_selection, automatic_topic_count, truncation, uncertainty]
    aliases_zh: [HDP自动主题有上界, HDP不是无限搜索]
    aliases_en: [bounded HDP auto topics, HDP truncation]
    source_id: paper.hdp.teh2006
    source_year: 2006
    source_locator: https://doi.org/10.1198/016214506000000302
    claim_scope: HDP auto 语义的理论边界；具体截断参数以 Gensim 与 THETA 实现为准。
    theta_support_status: supported
    content_markdown: |
      Planner 可以把 HDP 作为“不预先固定 K”的候选，但必须把结果描述为推断出的有效主题数，而不是“真实 K”。THETA 中仍应使用 topicCountMode=auto、numTopics=null，并由 maxTopics 表达上界；论文不能覆盖当前命令编译器的字段语义。

  - <<: *model_paper_base
    object_id: paper_source.dtm.blei2006
    title: Blei 2006 经典 DTM 论文
    model_ids: [dtm]
    scenario_tags: [paper, core_model, temporal, lda_seq]
    aliases_zh: [经典DTM论文, 动态主题模型论文]
    aliases_en: [Dynamic Topic Models paper, LDA-Seq]
    source_id: paper.dtm.blei2006
    source_year: 2006
    source_locator: https://doi.org/10.1145/1143844.1143859
    claim_scope: 经典 DTM 通过状态空间结构平滑主题随时间演化的原理。
    content_markdown: |
      经典 DTM 在有序时间片之间连接主题的自然参数，用于描述主题词分布随时间平滑变化。它要求时间切片有真实研究含义；采集制度变化、极小切片或缺失时间可能制造伪演化。

  - <<: *model_paper_base
    object_id: conflict.paper_dtm_vs_theta_dtm
    object_type: conflict_group
    title: 经典 LDA-Seq 与 THETA DTM 实现不可混同
    model_ids: [dtm]
    parameter_ids: [numTopics, epochs, batchSize]
    scenario_tags: [conflict, temporal, implementation_boundary]
    aliases_zh: [DTM实现差异, 经典DTM与THETA DTM]
    aliases_en: [classic DTM versus THETA DTM, LDA-Seq implementation mismatch]
    source_id: paper.dtm.blei2006
    source_year: 2006
    source_locator: https://doi.org/10.1145/1143844.1143859
    claim_scope: 经典论文与项目自带 PyTorch 动态神经模型之间的证据边界。
    theta_support_status: conditional
    conflict_group_id: dtm_implementation_identity
    content_markdown: |
      Blei 与 Lafferty 2006 支持“为什么需要时间演化主题模型”，但 THETA 当前 dtm 是自带的 PyTorch 动态神经模型，不是经典 LDA-Seq。Planner 不得从论文复制状态空间参数或推断算法到 THETA 计划；可执行字段只能来自 DTM 能力卡与 Resolver。

  - <<: *model_paper_base
    object_id: paper_source.btm.yan2013
    title: Yan 2013 BTM 原始论文
    model_ids: [btm]
    scenario_tags: [paper, core_model, short_text, biterm]
    aliases_zh: [BTM原始论文, 双词主题模型论文]
    aliases_en: [Biterm Topic Model paper, Yan 2013]
    source_id: paper.btm.yan2013
    source_year: 2013
    source_locator: https://doi.org/10.1145/2488388.2488514
    claim_scope: BTM 使用全语料 biterm 缓解短文本文档级共现稀疏的原理。
    content_markdown: |
      BTM 直接建模全语料中的词对共现，而不是只依赖每篇短文内部的丰富词共现。论文支持在推文、标题、短评论和短问卷回答中把 BTM 作为候选，但不能证明它对任意短文本或任意语言都必然优于 LDA、BERTopic 或其他模型。

  - <<: *model_paper_base
    object_id: rule.paper_btm_requires_biterms
    object_type: rule
    title: BTM 的短文本优势以有效 biterm 为前提
    model_ids: [btm]
    parameter_ids: [numTopics, epochs]
    scenario_tags: [short_text, feasibility, preprocessing, biterm]
    aliases_zh: [BTM有效词对前提, 短文本双词要求]
    aliases_en: [BTM valid biterm prerequisite, short text cooccurrence requirement]
    source_id: paper.btm.yan2013
    source_year: 2013
    source_locator: https://doi.org/10.1145/2488388.2488514
    claim_scope: 从 BTM 生成机制得到的数据可行性条件。
    theta_support_status: supported
    content_markdown: |
      推荐 BTM 前必须检查清洗和分词后的文本能否形成足够词对。若多数有效行少于两个 token，应先修正文本列或预处理，或改用其他候选。论文提供方法依据；THETA Validator V2 的 no-biterm 检查仍是不可绕过的 L1 硬约束。

