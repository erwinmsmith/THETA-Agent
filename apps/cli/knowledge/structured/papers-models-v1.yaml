    content_markdown: |
      THETA 在具备 R、rpy2 与 stm 时可走 R 后端，否则使用项目的 Python 近似实现。两种后端的估计、诊断和不确定性不能宣称数值等价。Planner 必须在计划中记录后端，并仅对实际后端承诺其原生产物。

  - <<: *model_paper_base
    object_id: paper_source.bertopic.grootendorst2022
    title: Grootendorst 2022 BERTopic 论文
    model_ids: [bertopic]
    scenario_tags: [paper, core_model, embedding, clustering, c_tf_idf]
    aliases_zh: [BERTopic论文, c-TF-IDF论文]
    aliases_en: [BERTopic paper, class-based TF-IDF]
    source_id: paper.bertopic.grootendorst2022
    source_year: 2022
    source_locator: https://arxiv.org/abs/2203.05794
    claim_scope: BERTopic 的嵌入、聚类与 c-TF-IDF 主题表示管线。
    content_markdown: |
      BERTopic 先生成文档嵌入，再进行降维和密度聚类，最后用 class-based TF-IDF 形成主题词表示。其主题本质更接近语义簇，不应自动当作 LDA 式混合成员生成模型；噪声点与离群文档是密度聚类行为的一部分。

  - <<: *model_paper_base
    object_id: rule.paper_bertopic_pipeline_semantics
    object_type: rule
    title: BERTopic 参数必须按管线阶段解释
    model_ids: [bertopic]
    parameter_ids: [nNeighbors, nComponents, minClusterSize, minSamples, topNWords, numTopics]
    scenario_tags: [hyperparameter, embedding, umap, hdbscan, topic_representation]
    aliases_zh: [BERTopic管线参数, BERTopic参数阶段]
    aliases_en: [BERTopic pipeline parameter semantics]
    source_id: paper.bertopic.grootendorst2022
    source_year: 2022
    source_locator: https://arxiv.org/abs/2203.05794
    claim_scope: BERTopic 参数所在阶段及其相互作用；具体默认值来自官方文档与 THETA 能力卡。
    theta_support_status: conditional
    content_markdown: |
      nNeighbors/nComponents 改变 UMAP 表示，minClusterSize/minSamples 改变 HDBSCAN 簇与噪声，topNWords 只改变主题表示输出。target_reduction 是聚类后的归并目标，不是训练前固定 K。调参时必须重新观察主题数、噪声比例、主题重复和代表文档，不能孤立优化单一参数。

  - <<: *model_paper_base
    object_id: failure.paper_bertopic_outlier_microclusters
    object_type: failure_mode
    title: BERTopic 噪声过高或微小主题过多
    model_ids: [bertopic]
    parameter_ids: [minClusterSize, minSamples, nNeighbors]
    scenario_tags: [failure, outliers, microclusters, clustering]
    aliases_zh: [BERTopic大量噪声, BERTopic微小主题]
    aliases_en: [BERTopic excessive outliers, BERTopic microclusters]
    source_id: paper.bertopic.grootendorst2022
    source_year: 2022
    source_locator: https://arxiv.org/abs/2203.05794
    claim_scope: BERTopic 密度聚类结果的常见失败表现与诊断方向。
    theta_support_status: conditional
    content_markdown: |
      大量 -1 噪声可能来自嵌入不适配、语料规模不足、minSamples 过保守或数据本身缺少密度结构；大量微小主题可能来自 minClusterSize 过低或局部结构过强。不要以“必须覆盖全部文档”为目标强行消除离群点，应比较覆盖率、主题质量与代表文档。

