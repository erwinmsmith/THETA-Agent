    theta_support_status: conditional
    content_markdown: |
      ETM 把词与主题置于同一嵌入空间，通过内积定义主题—词概率，并使用 amortized variational inference。该论文可帮助解释 THETA 的概念亲缘，但 THETA 的 Qwen 文档嵌入、损失项和训练模式构成不同实现，论文结果不能作为 THETA 性能证明。

  - <<: *model_paper_base
    object_id: rule.paper_theta_etm_conceptual_mapping
    object_type: rule
    title: THETA 与 ETM 只能建立概念映射
    model_ids: [theta, etm]
    scenario_tags: [implementation_boundary, embedding, bow_reconstruction, neural]
    aliases_zh: [THETA与ETM关系, THETA嵌入主题原理]
    aliases_en: [THETA ETM conceptual mapping]
    source_id: paper.etm.dieng2020
    source_year: 2020
    source_locator: https://doi.org/10.1162/tacl_a_00325
    claim_scope: ETM 论文与 THETA 代码之间的概念而非身份映射。
    theta_support_status: supported
    content_markdown: |
      THETA 编码 Qwen 文档嵌入得到 theta，并以 topic_embeddings × word_embeddingsᵀ 得到 beta，再用 theta × beta 重构 BOW。它具有 ETM 风格的嵌入解码思想，但不是对 ETM 论文的逐行复现。可执行参数和产物只能由 THETA 代码证据确认。

  - <<: *model_paper_base
    object_id: paper_source.top2vec.angelov2020
