    claim_scope: STM 将文档协变量引入主题流行度与内容分析的研究设计依据。
    content_markdown: |
      STM 允许研究者分析处理条件、群体属性等协变量与主题流行度或主题内容之间的关系。该方法仍是计算机辅助分析，主题命名、代表文本阅读和研究解释需要领域专家参与；协变量关联也不能未经设计直接宣称为因果效应。

