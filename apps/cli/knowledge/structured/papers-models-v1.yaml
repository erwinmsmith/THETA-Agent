    model_ids: [stm]
    parameter_ids: [metadataColumns]
    scenario_tags: [covariates, research_design, group_comparison, metadata]
    aliases_zh: [STM协变量选择, 元数据比较设计]
    aliases_en: [STM covariate design, structural topic metadata selection]
    source_id: paper.stm.roberts2014
    source_year: 2014
    source_locator: https://doi.org/10.1111/ajps.12103
    claim_scope: 选择 STM 与筛选协变量的研究设计原则。
    theta_support_status: conditional
    content_markdown: |
      只有当用户明确想比较群体、来源、处理条件或其他文档属性时，才应把 STM 作为主候选。ID、高基数标识符、正文直接派生字段、近乎常量字段或存在明显泄漏的字段不能自动作为协变量。计划应说明协变量影响的是主题流行度、主题内容还是仅作训练后分组描述。

